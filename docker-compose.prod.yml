services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic.yml:/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - cortexos_net

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortexos
      POSTGRES_USER: cortexos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cortexos_net
    # No port exposure — internal only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cortexos_net
    # No port exposure — internal only

  neo4j:
    image: neo4j:5.24
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - cortexos_net
    # No port exposure — internal only

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cortexos:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_URL: https://langfuse.cortexos.yourdomain.com
      TELEMETRY_ENABLED: "false"
    networks:
      - cortexos_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.cortexos.yourdomain.com`)"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls.certresolver=letsencrypt"
      - "traefik.http.routers.langfuse.middlewares=auth-headers@file,rate-limit@file"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cortexos:${POSTGRES_PASSWORD}@postgres:5432/cortexos
      REDIS_URL: redis://redis:6379/0
      GRAPHITI_URI: bolt://neo4j:7687
      GRAPHITI_USER: neo4j
      GRAPHITI_PASSWORD: ${NEO4J_PASSWORD}
      ENVIRONMENT: production
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - cortexos_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.cortexos.yourdomain.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=auth-headers@file,rate-limit@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cortexos:${POSTGRES_PASSWORD}@postgres:5432/cortexos
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - cortexos_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.cortexos.yourdomain.com
    depends_on:
      - backend
    networks:
      - cortexos_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`cortexos.yourdomain.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=auth-headers@file,rate-limit@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  traefik_certs:

networks:
  cortexos_net:
    driver: bridge
