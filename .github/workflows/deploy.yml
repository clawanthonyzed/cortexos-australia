name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false  # Never cancel in-flight deploys

jobs:
  ci-check:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        run: echo "Proceeding to deploy after CI checks."

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ci-check]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          script_stop: true
          script: |
            set -euo pipefail

            echo "=== CortexOS Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            # Navigate to project root
            cd /opt/cortexos

            # Pull latest code
            echo "--- Pulling latest code ---"
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists (never overwrite)
            if [ ! -f .env ]; then
              echo "ERROR: .env not found at /opt/cortexos/.env — aborting."
              exit 1
            fi

            # Pull new images
            echo "--- Pulling base images ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet

            # Build application images
            echo "--- Building application images ---"
            if [ "${{ inputs.force_rebuild }}" = "true" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
            else
              docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            fi

            # Rolling restart — start new containers before stopping old ones
            echo "--- Deploying services ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d \
              --remove-orphans \
              --wait \
              --wait-timeout 120

            # Run migrations
            echo "--- Running migrations ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend alembic upgrade head

            # Prune old images
            echo "--- Pruning old images ---"
            docker image prune -f

            echo "=== Deploy complete ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Health check — backend API
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.cortexos.yourdomain.com/health || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check PASSED (HTTP $HTTP_STATUS)"
            else
              echo "Health check FAILED (HTTP $HTTP_STATUS)"
              exit 1
            fi

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "DEPLOY FAILED at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /var/log/cortexos-deploy.log
            # Add webhook notification here if needed
