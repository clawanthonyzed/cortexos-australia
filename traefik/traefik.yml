# Traefik Static Configuration
# CortexOS Production

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard (disable in prod or restrict access)
api:
  dashboard: false
  insecure: false

# Entrypoints
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "cortexos.yourdomain.com"
            sans:
              - "api.cortexos.yourdomain.com"
              - "langfuse.cortexos.yourdomain.com"

# Certificate Resolvers — Let's Encrypt via ACME
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@yourdomain.com
      storage: /letsencrypt/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: cortexos_net
  file:
    filename: /dynamic.yml
    watch: true

# Logging
log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Authorization: drop
        Content-Type: keep
