[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85
env =
    DATABASE_URL=postgresql+asyncpg://cortex:cortex@localhost:5432/cortexos_test
    REDIS_URL=redis://localhost:6379/9
    SECRET_KEY=test-secret-key-do-not-use-in-production
    ENVIRONMENT=testing
    ANTHROPIC_API_KEY=test-key
    OPENAI_API_KEY=test-key
    GOOGLE_API_KEY=test-key
    OPENROUTER_API_KEY=test-key
    LANGFUSE_SECRET_KEY=test-key
    LANGFUSE_PUBLIC_KEY=test-key
    LANGFUSE_HOST=http://localhost:3000
    MEM0_API_KEY=test-key
    GRAPHITI_URI=bolt://localhost:7687
    GRAPHITI_USER=neo4j
    GRAPHITI_PASSWORD=test
    ETSY_API_KEY=test-key
    GUMROAD_ACCESS_TOKEN=test-token
    LEMONSQUEEZY_API_KEY=test-key
    GITHUB_TOKEN=test-token
    CORS_ORIGINS=["http://localhost:3000"]
